draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30.0
  combo_w: 28
  combo_h: 26
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: auto
  n_columns: 2
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: false
  key_side_pars:
    rel_x: 0.0
    rel_y: 4.0
    rel_w: 12.0
    rel_h: 12.0
    rx: 4.0
    ry: 4.0
  svg_extra_style: ''
  footer_text: Created with <a href="https://github.com/caksoylar/keymap-drawer">keymap-drawer</a>
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyphs: {}
parse_config:
  preprocess: true
  skip_binding_parsing: false
  raw_binding_map: {}
  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    t: ''
    type: trans
  mark_alternate_layer_activators: false
  modifier_fn_map:
    left_ctrl: Ctl
    right_ctrl: Ctl
    left_shift: Sft
    right_shift: Sft
    left_alt: Alt
    right_alt: AGr
    left_gui: Gui
    right_gui: Gui
    keycode_combiner: '{mods}+ {key}'
    mod_combiner: '{mod_1}+{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
  qmk_remove_keycode_prefix:
  - KC_
  qmk_keycode_map:
    L0: Base
    MCDDOT: cd ..
    MGITST: git status
    CTLKCR:
      h: Ctrl
      t: R
    CTLKCI:
      h: Ctrl
      t: I
    SHFTKCA:
      h: Shift
      t: A
    SHFTKCO:
      h: Shift
      t: O
    LT(LAY0,BSPC):
      h: LAY1
      t: $$mdi:backspace-outline$$
    LT(LAY1,DEL):
      h: LAY2
      t: $$mdi:keyboard-backspace$$
    LT(LAY2,TAB):
      h: LAY3
      t: $$mdi:keyboard-tab$$
    LT(LAY3,ENT):
      h: LAY4
      t: $$mdi:keyboard-return$$
    LT(LAY4,SPC):
      h: LAY5
      t: $$mdi:keyboard-space$$
    LT(LAY5,LWIN):
      h: LAY6
      t: gui
    UP: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$
    VOLU: $$mdi:volume-high$$
    VOLD: $$mdi:volume-low$$
    MNXT: $$mdi:skip-next$$
